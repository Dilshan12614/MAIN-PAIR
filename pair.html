<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DILA-MD PAIR CODE</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.65)
        ),
        url("https://wallpapercave.com/w/wp13381180.jpg");

      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;

      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .box {
      width: 100%;
      padding: 28px 22px;

      text-align: center;

      background: rgba(255, 255, 255, 0.88);

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(10px);
    }

    .logo-icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 12px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #8a2be2,
        #800080
      );

      color: white;

      font-size: 30px;

      box-shadow:
        0 5px 20px rgba(128, 0, 128, 0.4);
    }

    .title {
      margin: 8px 0;

      color: #111;

      font-size: 23px;
      font-weight: 900;

      letter-spacing: 1px;
    }

    .subtitle {
      margin-bottom: 22px;

      color: #555;

      font-size: 13px;
      font-weight: bold;
    }

    .instruction {
      margin-bottom: 10px;

      color: #222;

      font-size: 13px;
      font-weight: bold;
    }

    .input-container {
      width: 100%;

      display: flex;

      padding: 5px;

      gap: 5px;

      background: white;

      border-radius: 14px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.15);
    }

    .input-container input {
      min-width: 0;

      flex: 1;

      padding: 14px;

      border: none;
      border-left: 3px solid #8a2be2;

      outline: none;

      background: #f1f1f1;

      color: #111;

      font-size: 15px;

      border-radius: 10px 0 0 10px;
    }

    .input-container input:focus {
      border-left-color: #800080;
    }

    .input-container button {
      width: 95px;

      border: none;

      border-radius: 0 10px 10px 0;

      background: linear-gradient(
        135deg,
        #8a2be2,
        #800080
      );

      color: white;

      font-size: 13px;
      font-weight: 900;

      letter-spacing: 1px;

      cursor: pointer;

      transition: 0.2s;
    }

    .input-container button:hover {
      transform: scale(1.02);

      background: linear-gradient(
        135deg,
        #32cd32,
        #228b22
      );
    }

    .input-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #pair {
      margin-top: 20px;

      min-height: 25px;
    }

    #waiting-message {
      display: none;

      margin-top: 15px;

      color: #555;

      font-weight: bold;
    }

    .code-box {
      display: inline-block;

      margin-top: 8px;

      padding: 12px 18px;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 19px;

      font-weight: 900;

      letter-spacing: 2px;

      cursor: pointer;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.25);
    }

    .code-box span {
      color: #00ff88;
    }

    .success {
      color: #008000;

      font-weight: bold;

      font-size: 13px;
    }

    .error {
      color: #d00000;

      font-weight: bold;

      font-size: 13px;
    }

    .footer-text {
      margin-top: 22px;

      color: #666;

      font-size: 11px;

      font-weight: bold;
    }

    @media (max-width: 500px) {
      .container {
        padding: 15px;
      }

      .box {
        padding: 25px 17px;
      }

      .input-container {
        flex-direction: column;
      }

      .input-container input {
        width: 100%;

        border-radius: 10px;

        border-left: none;

        border-bottom: 3px solid #8a2be2;
      }

      .input-container button {
        width: 100%;

        min-height: 48px;

        border-radius: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box">

      <div class="logo-icon">
        <i class="fas fa-link"></i>
      </div>

      <div class="title">
        DILA-MD
      </div>

      <div class="subtitle">
        WHATSAPP PAIRING SYSTEM
      </div>

      <div class="instruction">
        ⚙️ Enter your WhatsApp number with country code
      </div>

      <div class="input-container">

        <input
          type="tel"
          id="number"
          placeholder="+94789123880"
          autocomplete="tel"
        >

        <button id="submit">
          ENTER
        </button>

      </div>

      <div id="waiting-message">
        🔎 Generating pairing code...
      </div>

      <main id="pair"></main>

      <div class="footer-text">
        DILA-MD • SESSION GENERATOR
      </div>

    </div>

  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>

  <script>

    const pairBox = document.getElementById("pair");
    const submitButton = document.getElementById("submit");
    const numberInput = document.getElementById("number");
    const waitingMessage = document.getElementById("waiting-message");


    async function Copy() {

      const codeElement = document.getElementById("copy");

      if (!codeElement) return;

      const code = codeElement.dataset.code || codeElement.innerText;

      try {

        await navigator.clipboard.writeText(code);

        codeElement.innerHTML = "✅ COPIED";

        setTimeout(() => {

          codeElement.innerHTML =
            'CODE: <span>' + code + '</span>';

        }, 1200);

      } catch (error) {

        alert("Copy failed. Please copy the code manually.");

      }

    }


    submitButton.addEventListener("click", async (e) => {

      e.preventDefault();


      const rawNumber = numberInput.value.trim();

      const cleanNumber =
        rawNumber.replace(/[^0-9]/g, "");


      pairBox.innerHTML = "";


      if (!cleanNumber) {

        pairBox.innerHTML =
          '<div class="error">❗ Enter your WhatsApp number with country code.</div>';

        return;

      }


      if (cleanNumber.length < 11) {

        pairBox.innerHTML =
          '<div class="error">❌ Invalid number format.</div>';

        return;

      }


      numberInput.disabled = true;
      submitButton.disabled = true;


      waitingMessage.style.display = "block";


      try {

        const response = await axios.get(
          "/code?number=" + encodeURIComponent(cleanNumber)
        );


        const data = response.data || {};


        waitingMessage.style.display = "none";


        if (!data.code) {

          pairBox.innerHTML =
            '<div class="error">❌ Pairing code service unavailable.</div>';

          numberInput.disabled = false;
          submitButton.disabled = false;

          return;
        }


        const code = String(data.code);


        pairBox.innerHTML = `

          <div class="success">
            ✅ Pairing code generated successfully
          </div>

          <br>

          <div
            id="copy"
            class="code-box"
            data-code="${code}"
            onclick="Copy()"
          >
            CODE:
            <span>${code}</span>
          </div>

          <br><br>

          <div style="font-size:12px;color:#555;font-weight:bold;">
            👆 Tap the code to copy
          </div>

        `;


      } catch (error) {

        console.error("Pairing request error:", error);


        waitingMessage.style.display = "none";


        pairBox.innerHTML =
          '<div class="error">❌ Unable to connect to pairing service.</div>';


        numberInput.disabled = false;
        submitButton.disabled = false;

      }

    });

  </script>

</body>
</html>
